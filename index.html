/* Brand tokens. These are copied from minimanager.tokens.json, not eyeballed.
   Changing a colour here changes it everywhere in the app. */
:root{
  --ink-navy:#0F2A44; --gold:#C6A962; --sage:#6E8F7E; --terracotta:#B76E5A;
  --ivory:#FDF8EF; --warm-grey:#CFC7BA;
  --surface:#FFFFFF; --bg:#FDF8EF;
  --text:#0F2A44; --text-2:#52606B; --border:#E5DED4;
  --success:#47745E; --warning:#A66E25; --danger:#A84743; --focus:#2F719D;
  --keyline:#FDF8EF;
  --r-card:18px; --r-ctl:12px; --tap:44px;
  --f-display:'Indira K',Georgia,serif;
  --f-body:'Inter',system-ui,-apple-system,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav-h:72px;
}
:root[data-theme="dark"]{
  --surface:#142B3E; --bg:#081C2E;
  --text:#FDF8EF; --text-2:#B6C5CF; --border:#344C5F;
  --keyline:#081C2E;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#142B3E; --bg:#081C2E;
    --text:#FDF8EF; --text-2:#B6C5CF; --border:#344C5F;
    --keyline:#081C2E;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--f-body); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
/* Any element holding text the user typed. white-space alone will not break a
   pasted link with no spaces, which can push the whole layout wider than the
   phone. */
.user-text{overflow-wrap:anywhere}

h1,h2,h3{margin:0 0 8px}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.2px}
.wrap{padding:0 20px;max-width:900px;margin:0 auto}
.muted{color:var(--text-2)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.bar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 20px 10px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);
}
header.bar .mark{width:26px;height:33px;flex:0 0 auto}
header.bar h1{font-family:var(--f-display);font-size:22px;margin:0;flex:1}
.iconbtn{
  min-width:var(--tap);min-height:var(--tap);border:1px solid var(--border);
  background:var(--surface);color:var(--text);border-radius:var(--r-ctl);
  font:inherit;font-size:14px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;padding:0 12px;
}
.iconbtn:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-card);padding:16px;margin:12px 0;
}
.row{display:flex;gap:12px;align-items:center}
.row.wrapm{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{
  min-height:var(--tap);padding:0 18px;border-radius:var(--r-ctl);
  border:1px solid var(--ink-navy);background:var(--ink-navy);color:var(--ivory);
  font:inherit;font-weight:600;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}

input,select,textarea{
  font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-ctl);
  padding:10px 12px;min-height:var(--tap);width:100%;
}
textarea{min-height:88px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--text-2)}

/* Stat strip on Home. Counts are words and numbers, never a pie chart on its
   own — the brief is explicit that colour and shape must not be the only way
   a state is communicated. */
/* Two columns on a phone, not auto-fit. auto-fit put three tiles across a
   390px screen and orphaned the fourth on its own row, at a different height
   because "models finished" wrapped. A fixed 2x2 is even and predictable. */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
@media(min-width:680px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.stat b{display:block;font-family:var(--f-num);font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--text-2)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:680px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-card);overflow:hidden;cursor:pointer;text-align:left;
  padding:0;font:inherit;color:var(--text);display:flex;flex-direction:column;
}
.tile .ph{aspect-ratio:1/1;background:var(--warm-grey);display:block;width:100%;object-fit:cover}
.tile .ph.empty{display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:12px}
.tile .meta{padding:10px 12px}
.tile .meta b{display:block;font-size:14px;line-height:1.3}

.chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);border-radius:999px;
  padding:5px 11px;font-size:12px;cursor:pointer;min-height:32px;
}
.chip[aria-pressed="true"]{background:var(--ink-navy);color:var(--ivory);border-color:var(--ink-navy)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}

/* Stage strip. The current stage is marked by fill AND by a tick AND by the
   label underneath, so it still reads with colour removed. */
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.stg{
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  border-radius:var(--r-ctl);padding:8px 10px;font-size:13px;cursor:pointer;min-height:38px;
}
.stg[data-on="1"]{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}
.stg[data-cur="1"]{background:var(--gold);border-color:var(--gold);color:var(--ink-navy);font-weight:700}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;min-height:var(--nav-h);background:none;border:0;color:var(--text-2);
  font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:8px 2px;
}
nav.tabs button[aria-current="page"]{color:var(--ink-navy);font-weight:700}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--gold)}}
nav.tabs button:disabled{opacity:.4;cursor:default}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

dialog{
  border:1px solid var(--border);border-radius:var(--r-card);padding:0;
  background:var(--surface);color:var(--text);width:min(560px,94vw);
}
dialog::backdrop{background:rgba(8,28,46,.5)}
dialog .dlgbody{padding:18px}
dialog h2{font-family:var(--f-display);font-size:20px}

.empty{
  text-align:center;padding:36px 20px;color:var(--text-2);
}
.empty p{margin:0 0 14px}

.photos{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:var(--r-ctl);border:1px solid var(--border)}
.photowrap{position:relative}
.photowrap button{
  position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--border);background:var(--surface);color:var(--danger);
  cursor:pointer;font-size:14px;line-height:1;padding:0;
}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
  background:var(--ink-navy);color:var(--ivory);padding:12px 18px;
  border-radius:var(--r-ctl);z-index:60;max-width:90vw;font-size:14px;
}
:root[data-theme="dark"] .toast{background:var(--gold);color:var(--ink-navy)}

.notice{
  border:1px dashed var(--border);border-radius:var(--r-card);
  padding:16px;margin:12px 0;color:var(--text-2);
}
hr{border:0;border-top:1px solid var(--border);margin:18px 0}
a{color:var(--focus)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

  <!-- The real symbol from the brand kit, inlined. Not redrawn, not an emoji.

    <path d="M 150 86 C 144 104 133 124 126 144 C 119 162 121 174 128 183 C 139 198 161 198 172 183 C 179 174 181 162 174 144 C 167 124 156 104 150 86 Z" fill="none" stroke="var(--keyline)" stroke-width="11" stroke-linejoin="round"/>

<main id="app" class="wrap"></main>

<nav class="tabs" id="tabs" aria-label="Main">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
  <button data-tab="coll"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>Collection</button>
  <button data-tab="paints"><svg viewBox="0 0 24 24"><path d="M12 3c-3 5-5 7.5-5 10a5 5 0 0 0 10 0c0-2.5-2-5-5-10Z"/></svg>Paints</button>
  <button data-tab="recipes"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h6"/></svg>Recipes</button>
  <button data-tab="hang" disabled title="Coming later"><svg viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>Hangouts</button>
</nav>

<dialog id="dlg"><div class="dlgbody" id="dlgBody"></div></dialog>

<script>
"use strict";
/* ===========================================================================
   MiniManager
   One file. No build step, no framework, no network. Everything below runs in
   the browser exactly as written.

   Data lives in two places:
     - localStorage  'mm.data'   the records (small, synchronous, easy to export)
     - IndexedDB     'mm-photos' the photo blobs (large, must not go in
                                 localStorage, which is capped around 5 MB)
   =========================================================================== */

const APP_VERSION = 'v001';

/* --- tiny helpers. Declared above everything that calls them: `const` does
       not hoist, so a helper defined below a renderer is a crash. ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let toastTimer = null;
function toast(msg){
  const old = $('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role','status'); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

/* A promise that never settles cannot be caught. On iOS with iCloud Photos set
   to "Optimise Storage" the bytes of a picked photo are not on the device, and
   a stalled fetch simply never returns — no error, no rejection. Only a clock
   catches that, so every photo read goes through here. */
function deadline(promise, ms, label){
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error(label + ' timed out after ' + (ms/1000) + 's')), ms);
    promise.then(v => { clearTimeout(t); resolve(v); },
                 e => { clearTimeout(t); reject(e); });
  });
}

/* --- the stored shape ----------------------------------------------------- */
const DEFAULT_STAGES = ['Unbuilt','Built','Primed','Basecoat','Shading','Highlights','Basing','Finished'];

const BLANK = { v:1, systems:[], factions:[], minis:[], stages:DEFAULT_STAGES.slice(), settings:{ theme:'' } };

let data = BLANK;

function load(){
  let raw = null;
  try { raw = localStorage.getItem('mm.data'); } catch (e) { raw = null; }
  if (!raw){ data = structuredClone(BLANK); return; }
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
  if (!parsed || typeof parsed !== 'object'){
    toast('Saved data could not be read. Starting fresh.');
    data = structuredClone(BLANK); return;
  }
  /* Array.isArray, never a truthy or .length check. A string has .length, so a
     corrupted value like systems:"x" would walk straight past a loose guard and
     then blank the app on first render. */
  data = {
    v: 1,
    systems:  Array.isArray(parsed.systems)  ? parsed.systems  : [],
    factions: Array.isArray(parsed.factions) ? parsed.factions : [],
    minis:    Array.isArray(parsed.minis)    ? parsed.minis    : [],
    stages:   Array.isArray(parsed.stages) && parsed.stages.length ? parsed.stages : DEFAULT_STAGES.slice(),
    settings: (parsed.settings && typeof parsed.settings === 'object') ? parsed.settings : { theme:'' }
  };
}

function save(){
  try {
    localStorage.setItem('mm.data', JSON.stringify(data));
  } catch (e) {
    /* A give-up path must say something. Silently failing to save is the worst
       possible outcome here — the user carries on believing it is stored. */
    toast('Could not save. Your device storage may be full.');
  }
}

/* --- photos: IndexedDB ---------------------------------------------------- */
let idb = null;
function openDB(){
  if (idb) return Promise.resolve(idb);
  return deadline(new Promise((resolve, reject) => {
    const req = indexedDB.open('mm-photos', 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains('photos'))
        req.result.createObjectStore('photos', { keyPath:'id' });
    };
    req.onsuccess = () => { idb = req.result; resolve(idb); };
    req.onerror   = () => reject(req.error || new Error('IndexedDB refused to open'));
    req.onblocked = () => reject(new Error('IndexedDB is blocked by another tab'));
  }), 15000, 'Opening photo storage');
}

/* IndexedDB settles FOUR ways, not two: complete, error, abort and blocked.
   WebKit aborts a transaction on suspend/resume, which is exactly what opening
   the photo picker does. An unhandled abort looks like a photo that vanished. */
function tx(mode, fn){
  return openDB().then(db => deadline(new Promise((resolve, reject) => {
    const t = db.transaction('photos', mode);
    const store = t.objectStore('photos');
    let out;
    t.oncomplete = () => resolve(out);
    t.onerror    = () => reject(t.error || new Error('Photo storage error'));
    t.onabort    = () => reject(t.error || new Error('Photo storage was interrupted'));
    const r = fn(store);
    if (r) r.onsuccess = () => { out = r.result; };
  }), 15000, 'Photo storage'));
}

const putPhoto = (id, blob) => tx('readwrite', s => s.put({ id, blob }));
const getPhoto = id        => tx('readonly',  s => s.get(id));
const delPhoto = id        => tx('readwrite', s => s.delete(id));

/* --- derived --------------------------------------------------------------- */
const sysName = id => (data.systems.find(s => s.id === id) || {}).name || '';
const facName = id => (data.factions.find(f => f.id === id) || {}).name || '';
const stageIx = m => { const i = data.stages.indexOf(m.stage); return i < 0 ? 0 : i; };
const isDone  = m => m.stage === data.stages[data.stages.length - 1];

function counts(){
  const total = data.minis.reduce((n, m) => n + (Number(m.total) || 1), 0);
  const done  = data.minis.reduce((n, m) => n + (Number(m.done)  || 0), 0);
  const started = data.minis.filter(m => stageIx(m) > 0 && !isDone(m)).length;
  const backlog = data.minis.filter(m => stageIx(m) === 0).length;
  return { total, done, started, backlog, entries: data.minis.length };
}

/* --- state ---------------------------------------------------------------- */
const state = { tab:'home', openMini:null, view:'grid', q:'', fSys:'', fStage:'' };

/* --- theme ---------------------------------------------------------------- */
function applyTheme(){
  const t = data.settings.theme || '';
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

/* ===========================================================================
   Screens
   =========================================================================== */

function screenHome(){
  const c = counts();
  const recent = data.minis.slice()
    .filter(m => !isDone(m))
    .sort((a, b) => (b.updated || 0) - (a.updated || 0))
    .slice(0, 6);

  let h = '';
  h += '<p class="muted small" style="margin:14px 0 2px">' + greeting() + '</p>';
  h += '<h2 class="display" style="font-size:26px;margin-bottom:14px">Your collection</h2>';

  if (c.entries === 0){
    /* The empty state offers BOTH actions. An earlier version offered only
       "Add a miniature", which meant a brand-new install had no route to
       creating a game system at all until the first entry existed. */
    h += '<div class="empty"><p>Nothing in here yet. Add your first miniature and the numbers start filling in.</p>'
      +  '<div class="row wrapm" style="justify-content:center">'
      +  '<button class="btn" data-act="addMini">Add a miniature</button>'
      +  '<button class="btn ghost" data-act="addSys">Add a game system</button></div></div>';
    return h;
  }

  h += '<div class="stats">'
    +  stat(c.backlog, 'in backlog')
    +  stat(c.started, 'in progress')
    +  stat(c.done + ' / ' + c.total, 'models finished')
    +  stat(c.entries, c.entries === 1 ? 'entry' : 'entries')
    +  '</div>';

  if (recent.length){
    h += '<h3 style="margin-top:22px">Continue painting</h3><div class="grid">';
    recent.forEach(m => { h += tile(m); });
    h += '</div>';
  }

  h += '<h3 style="margin-top:24px">Quick actions</h3><div class="row wrapm">'
    +  '<button class="btn" data-act="addMini">Add a miniature</button>'
    +  '<button class="btn ghost" data-act="addSys">Add a game system</button>'
    +  '</div>';
  return h;
}

function greeting(){
  const hr = new Date().getHours();
  if (hr < 12) return 'Good morning.';
  if (hr < 18) return 'Good afternoon.';
  return 'Good evening.';
}
const stat = (n, label) => '<div class="stat"><b class="num">' + esc(n) + '</b><span>' + esc(label) + '</span></div>';

function tile(m){
  const pid = Array.isArray(m.photos) && m.photos.length ? m.photos[0] : '';
  const img = pid
    ? '<img class="ph" data-photo="' + esc(pid) + '" alt="">'
    : '<div class="ph empty">no photo yet</div>';
  const sub = [sysName(m.sys), facName(m.fac)].filter(Boolean).join(' · ');
  const n = Number(m.total) || 1, d = Number(m.done) || 0;
  return '<button class="tile" data-open="' + esc(m.id) + '">' + img
    + '<div class="meta"><b class="user-text">' + esc(m.name) + '</b>'
    + (sub ? '<div class="small muted user-text">' + esc(sub) + '</div>' : '')
    + '<div class="small muted">' + esc(m.stage) + (n > 1 ? ' · <span class="num">' + d + ' of ' + n + '</span> finished' : '') + '</div>'
    + '</div></button>';
}

function screenCollection(){
  let h = '';
  h += '<div class="row spread" style="margin:14px 0 6px"><h2 class="display" style="font-size:24px;margin:0">Collection</h2>'
    +  '<button class="btn sm" data-act="addMini">Add</button></div>';

  if (data.minis.length === 0){
    return h + '<div class="empty"><p>No miniatures yet. A box of ten counts as one entry with a count of ten — you do not need a record per model.</p>'
      + '<button class="btn" data-act="addMini">Add your first</button></div>';
  }

  h += '<input id="q" type="search" placeholder="Search by name, tag or notes" value="' + esc(state.q) + '">';

  h += '<div class="chips">'
    +  '<button class="chip" data-view="' + (state.view === 'grid' ? 'list' : 'grid') + '">'
    +  (state.view === 'grid' ? 'List view' : 'Grid view') + '</button>';
  data.systems.forEach(s => {
    h += '<button class="chip" data-fsys="' + esc(s.id) + '" aria-pressed="' + (state.fSys === s.id) + '">' + esc(s.name) + '</button>';
  });
  data.stages.forEach(st => {
    h += '<button class="chip" data-fstage="' + esc(st) + '" aria-pressed="' + (state.fStage === st) + '">' + esc(st) + '</button>';
  });
  h += '</div>';

  const list = filtered();
  if (!list.length) return h + '<div class="empty"><p>Nothing matches those filters.</p><button class="btn ghost" data-act="clearFilters">Clear filters</button></div>';

  h += '<p class="small muted"><span class="num">' + list.length + '</span> of <span class="num">' + data.minis.length + '</span> shown</p>';

  if (state.view === 'grid'){
    h += '<div class="grid">'; list.forEach(m => { h += tile(m); }); h += '</div>';
  } else {
    list.forEach(m => {
      const n = Number(m.total) || 1, d = Number(m.done) || 0;
      h += '<button class="card row" data-open="' + esc(m.id) + '" style="width:100%;text-align:left;cursor:pointer">'
        +  '<div class="grow"><b class="user-text">' + esc(m.name) + '</b>'
        +  '<div class="small muted user-text">' + esc([sysName(m.sys), facName(m.fac)].filter(Boolean).join(' · ')) + '</div></div>'
        +  '<div class="small muted" style="text-align:right">' + esc(m.stage)
        +  (n > 1 ? '<br><span class="num">' + d + ' of ' + n + '</span>' : '') + '</div></button>';
    });
  }
  return h;
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return data.minis.filter(m => {
    if (state.fSys   && m.sys   !== state.fSys)   return false;
    if (state.fStage && m.stage !== state.fStage) return false;
    if (!q) return true;
    return (m.name + ' ' + (m.tags || '') + ' ' + (m.notes || '')).toLowerCase().includes(q);
  }).sort((a, b) => (b.updated || 0) - (a.updated || 0));
}

function screenMini(){
  const m = data.minis.find(x => x.id === state.openMini);
  if (!m){
    /* Not a silent return. If this ever happens the user must be told why the
       screen is empty rather than staring at nothing. */
    return '<div class="empty"><p>That miniature no longer exists.</p><button class="btn" data-act="back">Back to collection</button></div>';
  }
  const n = Number(m.total) || 1, d = Number(m.done) || 0;
  const cur = stageIx(m);

  let h = '<button class="btn ghost sm" data-act="back" style="margin:14px 0">← Collection</button>';
  h += '<h2 class="display user-text" style="font-size:26px">' + esc(m.name) + '</h2>';
  const sub = [sysName(m.sys), facName(m.fac)].filter(Boolean).join(' · ');
  if (sub) h += '<p class="muted user-text" style="margin-top:-4px">' + esc(sub) + '</p>';

  h += '<div class="card"><h3>Progress</h3>';
  h += '<p class="small muted">Tap a stage to move this entry to it. Every stage up to it counts as done.</p>';
  h += '<div class="stages">';
  data.stages.forEach((s, i) => {
    h += '<button class="stg" data-stage="' + esc(s) + '" data-on="' + (i < cur ? 1 : 0) + '" data-cur="' + (i === cur ? 1 : 0) + '">'
      +  (i < cur ? '✓ ' : '') + esc(s) + '</button>';
  });
  h += '</div>';

  if (n > 1){
    h += '<label for="doneN">How many of the ' + n + ' are finished?</label>'
      +  '<div class="row"><input id="doneN" type="number" min="0" max="' + n + '" value="' + d + '" style="max-width:120px">'
      +  '<span class="muted small"><span class="num">' + d + ' of ' + n + '</span> finished</span></div>';
  }
  h += '</div>';

  h += '<div class="card"><div class="row spread"><h3 style="margin:0">Photos</h3>'
    +  '<label class="btn sm ghost" style="margin:0;display:inline-flex;align-items:center" for="photoIn">Add photo</label></div>'
    +  '<input id="photoIn" type="file" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">'
    +  '<div class="photos" id="photoList">';
  (Array.isArray(m.photos) ? m.photos : []).forEach(pid => {
    h += '<span class="photowrap"><img data-photo="' + esc(pid) + '" alt=""><button data-delphoto="' + esc(pid) + '" aria-label="Remove photo">×</button></span>';
  });
  h += '</div>';
  if (!(Array.isArray(m.photos) && m.photos.length)) h += '<p class="small muted">No photos yet. They stay on this device.</p>';
  h += '</div>';

  h += '<div class="card"><h3>Details</h3>'
    +  '<label for="eName">Name</label><input id="eName" value="' + esc(m.name) + '">'
    +  '<label for="eTotal">How many models in this entry</label><input id="eTotal" type="number" min="1" value="' + n + '">'
    +  '<label for="eTags">Tags</label><input id="eTags" value="' + esc(m.tags || '') + '" placeholder="e.g. tournament, kitbash">'
    +  '<label for="eNotes">Notes</label><textarea id="eNotes" class="user-text">' + esc(m.notes || '') + '</textarea>'
    +  '<div class="row" style="margin-top:14px"><button class="btn" data-act="saveMini">Save changes</button>'
    +  '<button class="btn danger" data-act="delMini">Delete</button></div></div>';
  return h;
}

function screenPaints(){
  return '<h2 class="display" style="font-size:24px;margin:16px 0 8px">Paints</h2>'
    + '<div class="notice"><p><b>Not built yet.</b> This is stage three of the plan: your paint inventory, '
    + 'photographed swatches over named undercoats, and the comparison view.</p>'
    + '<p style="margin:10px 0 0">It is waiting on the paint catalogue decision, which is recorded in BACKLOG.md.</p></div>';
}
function screenRecipes(){
  return '<h2 class="display" style="font-size:24px;margin:16px 0 8px">Recipes</h2>'
    + '<div class="notice"><p><b>Not built yet.</b> Stage three: reusable recipes like Aged Bone or Oxidised Copper, '
    + 'each an ordered set of steps, attachable to as many miniatures as you like.</p></div>';
}

/* ===========================================================================
   Render
   =========================================================================== */
const TITLES = { home:'MiniManager', coll:'Collection', mini:'Collection', paints:'Paints', recipes:'Recipes' };

function render(){
  const app = $('#app');
  let html;
  if (state.tab === 'home')        html = screenHome();
  else if (state.tab === 'coll')   html = state.openMini ? screenMini() : screenCollection();
  else if (state.tab === 'paints') html = screenPaints();
  else                             html = screenRecipes();

  app.innerHTML = html;
  $('#screenTitle').textContent = TITLES[state.openMini && state.tab === 'coll' ? 'mini' : state.tab] || 'MiniManager';

  $$('#tabs button').forEach(b => {
    if (b.dataset.tab === state.tab) b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });

  hydratePhotos();
}

/* Images are rendered with a data-photo id and filled in afterwards, because
   the blob has to come out of IndexedDB asynchronously. Each object URL is
   revoked when the element leaves the page. */
const urlCache = new Map();
function hydratePhotos(){
  $$('[data-photo]').forEach(img => {
    const id = img.dataset.photo;
    if (urlCache.has(id)){ img.src = urlCache.get(id); return; }
    getPhoto(id).then(rec => {
      if (!rec || !rec.blob){ img.replaceWith(Object.assign(document.createElement('div'), { className:'ph empty', textContent:'photo missing' })); return; }
      const u = URL.createObjectURL(rec.blob);
      urlCache.set(id, u);
      img.src = u;
    }).catch(err => { img.alt = 'Photo could not be loaded'; console.warn('photo', id, err.message); });
  });
}

/* ===========================================================================
   Dialogs
   =========================================================================== */
function openDialog(title, bodyHtml, onOk, okLabel){
  $('#dlgBody').innerHTML = '<h2>' + esc(title) + '</h2>' + bodyHtml
    + '<div class="row" style="margin-top:16px;justify-content:flex-end">'
    + '<button class="btn ghost" data-dlg="cancel">Cancel</button>'
    + '<button class="btn" data-dlg="ok">' + esc(okLabel || 'Save') + '</button></div>';
  const dlg = $('#dlg');
  dlg.showModal();
  dlg.onclick = e => {
    const b = e.target.closest('[data-dlg]');
    if (!b) return;
    if (b.dataset.dlg === 'cancel'){ dlg.close(); return; }
    if (onOk() !== false) dlg.close();
  };
}

function dlgAddSystem(){
  openDialog('Add a game system',
    '<label for="sName">Name</label><input id="sName" placeholder="Warhammer 40,000, Middle-earth, your own">',
    () => {
      const v = $('#sName').value.trim();
      if (!v){ toast('Give it a name first.'); return false; }
      data.systems.push({ id:uid(), name:v }); save(); render(); toast('System added.');
    }, 'Add');
}

function dlgAddMini(){
  const sysOpts = data.systems.map(s => '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>').join('');
  const facOpts = data.factions.map(f => '<option value="' + esc(f.id) + '">' + esc(f.name) + '</option>').join('');
  openDialog('Add a miniature',
      '<label for="mName">Name</label><input id="mName" placeholder="Skaven Clanrats">'
    + '<label for="mSys">Game system</label><select id="mSys"><option value="">None yet</option>' + sysOpts + '</select>'
    + '<label for="mFacNew">Army or faction</label><select id="mFac"><option value="">None yet</option>' + facOpts + '</select>'
    + '<input id="mFacNew" placeholder="…or type a new one" style="margin-top:8px">'
    + '<label for="mTotal">How many models</label><input id="mTotal" type="number" min="1" value="1">',
    () => {
      const name = $('#mName').value.trim();
      if (!name){ toast('Give it a name first.'); return false; }
      const sys = $('#mSys').value;
      let fac = $('#mFac').value;
      const newFac = $('#mFacNew').value.trim();
      if (newFac){ const f = { id:uid(), sys, name:newFac }; data.factions.push(f); fac = f.id; }
      const total = Math.max(1, Number($('#mTotal').value) || 1);
      data.minis.push({
        id:uid(), name, sys, fac, total, done:0,
        stage:data.stages[0], tags:'', notes:'', photos:[],
        created:Date.now(), updated:Date.now()
      });
      save(); state.tab = 'coll'; state.openMini = null; render(); toast('Added.');
    }, 'Add');
}

/* ===========================================================================
   Events
   =========================================================================== */

/* One tap, one write. Without a lock a double tap on Add photo starts two
   reads of the same file and writes two records for one picture. */
let busy = false;

document.addEventListener('click', e => {
  const t = e.target;

  const tab = t.closest('#tabs button');
  if (tab && !tab.disabled){ state.tab = tab.dataset.tab; state.openMini = null; render(); return; }

  const open = t.closest('[data-open]');
  if (open){ state.openMini = open.dataset.open; state.tab = 'coll'; render(); window.scrollTo(0,0); return; }

  const act = t.closest('[data-act]');
  if (act){
    const a = act.dataset.act;
    if (a === 'addMini')  return dlgAddMini();
    if (a === 'addSys')   return dlgAddSystem();
    if (a === 'back')     { state.openMini = null; render(); return; }
    if (a === 'clearFilters'){ state.fSys = ''; state.fStage = ''; state.q = ''; render(); return; }
    if (a === 'saveMini') return saveMiniEdits();
    if (a === 'delMini')  return deleteMini();
  }

  const view = t.closest('[data-view]');
  if (view){ state.view = view.dataset.view; render(); return; }

  const fs = t.closest('[data-fsys]');
  if (fs){ state.fSys = (state.fSys === fs.dataset.fsys) ? '' : fs.dataset.fsys; render(); return; }

  const fst = t.closest('[data-fstage]');
  if (fst){ state.fStage = (state.fStage === fst.dataset.fstage) ? '' : fst.dataset.fstage; render(); return; }

  const stg = t.closest('[data-stage]');
  if (stg){
    const m = data.minis.find(x => x.id === state.openMini);
    if (!m) return;
    m.stage = stg.dataset.stage;
    /* Reaching the last stage with a single-model entry means it is finished.
       For a box of ten, the count is the truth and is left to the user. */
    if (isDone(m) && (Number(m.total) || 1) === 1) m.done = 1;
    m.updated = Date.now(); save(); render(); return;
  }

  const del = t.closest('[data-delphoto]');
  if (del) return removePhoto(del.dataset.delphoto);
});

document.addEventListener('input', e => {
  if (e.target.id === 'q'){ state.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); if (q){ q.focus(); q.setSelectionRange(pos,pos); } }
  if (e.target.id === 'doneN'){
    const m = data.minis.find(x => x.id === state.openMini); if (!m) return;
    m.done = Math.max(0, Math.min(Number(m.total) || 1, Number(e.target.value) || 0));
    m.updated = Date.now(); save();
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'photoIn') addPhotos(e.target.files);
});

function saveMiniEdits(){
  const m = data.minis.find(x => x.id === state.openMini); if (!m) return;
  const name = $('#eName').value.trim();
  if (!name){ toast('A name is needed.'); return; }
  m.name  = name;
  m.total = Math.max(1, Number($('#eTotal').value) || 1);
  if (m.done > m.total) m.done = m.total;
  m.tags  = $('#eTags').value.trim();
  m.notes = $('#eNotes').value;
  m.updated = Date.now();
  save(); render(); toast('Saved.');
}

function deleteMini(){
  const m = data.minis.find(x => x.id === state.openMini); if (!m) return;
  openDialog('Delete this entry?',
    '<p class="user-text">' + esc(m.name) + ' and its photos will be removed from this device. This cannot be undone.</p>',
    () => {
      (Array.isArray(m.photos) ? m.photos : []).forEach(pid => { delPhoto(pid).catch(() => {}); });
      data.minis = data.minis.filter(x => x.id !== m.id);
      save(); state.openMini = null; render(); toast('Deleted.');
    }, 'Delete');
}

async function addPhotos(fileList){
  const files = Array.from(fileList || []);
  if (!files.length) return;
  if (busy){ toast('Still working on the last one.'); return; }
  busy = true;
  const m = data.minis.find(x => x.id === state.openMini);
  if (!m){ busy = false; return; }

  let added = 0, failed = 0;
  for (const f of files){
    try {
      /* 45 s is the give-up point for a single photo. An iCloud fetch that is
         genuinely working can take tens of seconds on a poor connection; one
         that has stalled never returns at all. */
      const blob = await deadline(Promise.resolve(f.slice()), 45000, 'Reading ' + f.name);
      const id = uid();
      await putPhoto(id, blob);
      if (!Array.isArray(m.photos)) m.photos = [];
      m.photos.push(id);
      added++;
    } catch (err){
      failed++;
      console.warn('photo failed', f && f.name, err.message);
    }
  }
  m.updated = Date.now();
  save(); busy = false; render();

  if (added && !failed)      toast(added === 1 ? 'Photo added.' : added + ' photos added.');
  else if (added && failed)  toast(added + ' added, ' + failed + ' could not be read.');
  else                       toast('That photo could not be read. If it is in iCloud, open it in Photos first so it downloads.');
}

function removePhoto(pid){
  const m = data.minis.find(x => x.id === state.openMini); if (!m) return;
  m.photos = (Array.isArray(m.photos) ? m.photos : []).filter(x => x !== pid);
  m.updated = Date.now(); save();
  delPhoto(pid).catch(err => toast('Removed from the entry, but the file could not be deleted: ' + err.message));
  if (urlCache.has(pid)){ URL.revokeObjectURL(urlCache.get(pid)); urlCache.delete(pid); }
  render();
}

/* --- header buttons -------------------------------------------------------- */
$('#themeBtn').addEventListener('click', () => {
  const cur = data.settings.theme || '';
  data.settings.theme = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  save(); applyTheme();
  toast(data.settings.theme === 'dark' ? 'Dark mode.' : data.settings.theme === 'light' ? 'Light mode.' : 'Following your device.');
});

$('#moreBtn').addEventListener('click', () => {
  const c = counts();
  openDialog('More',
      '<p class="small muted">MiniManager <span class="num">' + APP_VERSION + '</span> · '
    + '<span class="num">' + c.entries + '</span> entries, <span class="num">' + c.done + ' of ' + c.total + '</span> models finished</p>'
    + '<hr><h3 style="font-size:15px">Your data</h3>'
    + '<p class="small muted">Everything is stored on this device only. Nothing is uploaded anywhere.</p>'
    + '<div class="row wrapm" style="margin-top:10px">'
    + '<button class="btn ghost sm" id="expBtn">Export a backup</button>'
    + '<label class="btn ghost sm" for="impIn" style="margin:0;display:inline-flex;align-items:center">Restore a backup</label>'
    + '<input id="impIn" type="file" accept="application/json" style="position:absolute;width:1px;height:1px;opacity:0">'
    + '</div>'
    + '<hr><h3 style="font-size:15px">Acknowledgements</h3>'
    + '<p class="small muted">Paint catalogue data is not yet included. When it is, the licence notice goes here.</p>'
    + '<p class="small muted">Paint and brand names are trademarks of their owners. MiniManager is not affiliated with or endorsed by any manufacturer.</p>',
    () => true, 'Close');

  $('#expBtn').addEventListener('click', exportData);
  $('#impIn').addEventListener('change', e => importData(e.target.files[0]));
});

function exportData(){
  /* Photos are deliberately not in the export. They would make a JSON file of
     hundreds of megabytes that most phones cannot build in memory. The records
     are what matter for portability; photo backup comes with cloud sync. */
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'minimanager-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Backup saved. Photos are not included.');
}

function importData(file){
  if (!file) return;
  file.text().then(txt => {
    let parsed = null;
    try { parsed = JSON.parse(txt); } catch (e) { parsed = null; }
    if (!parsed || !Array.isArray(parsed.minis)){ toast('That file is not a MiniManager backup.'); return; }
    localStorage.setItem('mm.data', txt);
    load(); applyTheme(); $('#dlg').close(); render();
    toast('Restored ' + parsed.minis.length + ' entries.');
  }).catch(err => toast('That file could not be read: ' + err.message));
}

/* ===========================================================================
   Start
   =========================================================================== */
load();
applyTheme();
render();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('sw', err.message));
  });
}
</script>
